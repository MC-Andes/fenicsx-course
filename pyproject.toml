[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mcandes-fenicsx"
version = "0.1.1"
description = "Utilidades y ejemplos del curso FEniCSx/DOLFINx de MC-Andes"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "MC-Andes"}]
dependencies = ["numpy>=1.26", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = [
  "mypy>=1.11",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.8",
]
docs = ["mkdocs-material>=9.5", "pymdown-extensions>=10.0"]

[project.scripts]
mcandes-validate-examples = "mcandes_fenicsx.validation_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --cov=mcandes_fenicsx --cov-report=term-missing"
testpaths = ["tests"]
markers = [
  "dolfinx: requiere el entorno FEniCSx",
  "parallel: debe ejecutarse mediante mpirun",
  "slow: estudio numérico fuera del smoke test",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["site"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"examples/*.py" = ["B018"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "scripts"]
ignore_missing_imports = true
