name: Nightly numerical suite

on:
  schedule:
    - cron: "17 5 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

env:
  # Fuerza transportes locales/TCP compatibles con runners hospedados.
  UCX_TLS: self,sm,tcp

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  all-examples:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: conda-lock.yml
          environment-name: mcandes-fenicsx-course
          cache-environment: true
          init-shell: bash
      - name: Install course package
        shell: micromamba-shell {0}
        run: python -m pip install -e .
      - name: Complete quick suite
        shell: micromamba-shell {0}
        run: python scripts/run_all_examples.py --output results/nightly
      - name: Representative MPI families
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          mpirun -n 2 python examples/06_linear_elasticity.py --quick --output results/mpi2
          mpirun -n 2 python examples/10_stokes_channel.py --quick --output results/mpi2
          mpirun -n 2 python examples/12_cahn_hilliard.py --quick --output results/mpi2
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: nightly-results
          path: results/
          retention-days: 14

  external-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --max-retries 3
            --retry-wait-time 2
            --exclude-path PLAN_CURSO_FENICSX_DOLFINX.md
            docs README.md
          fail: true
