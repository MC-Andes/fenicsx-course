name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # Evita que UCX sondee la interfaz RDMA virtual de los runners hospedados.
  UCX_TLS: self,sm,tcp

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install lightweight tooling
        run: python -m pip install -e ".[dev,docs]"
      - name: Ruff
        run: ruff check .
      - name: Unit tests
        run: pytest tests/unit
      - name: Metadata and code links
        run: python scripts/validate_examples.py
      - name: Compile scripts
        run: python -m compileall -q examples exercises scripts src
      - name: Documentation
        run: mkdocs build --strict

  exercises-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Execute starter descriptions and solutions
        run: |
          python exercises/starter/01_objects.py
          python exercises/starter/02_boundary_measure.py
          python exercises/starter/03_force_balance.py
          python exercises/solutions/01_objects.py
          python exercises/solutions/02_boundary_measure.py
          python exercises/solutions/03_force_balance.py

  serial-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: conda-lock.yml
          environment-name: mcandes-fenicsx-course
          cache-environment: true
          init-shell: bash
      - name: Install course package
        shell: micromamba-shell {0}
        run: python -m pip install -e .
      - name: Foundational examples
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          python examples/00_sanity_check.py --quick --output results
          python examples/03_tagged_boundaries.py --quick --output results
          python examples/01_poisson_manufactured.py --quick --output results
          python examples/05_heat_diffusion.py --quick --output results
          python examples/06_linear_elasticity.py --quick --write-fields --output results
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: serial-smoke-results
          path: results/*.json
          retention-days: 7

  parallel-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: conda-lock.yml
          environment-name: mcandes-fenicsx-course
          cache-environment: true
          init-shell: bash
      - name: Install course package
        shell: micromamba-shell {0}
        run: python -m pip install -e .
      - name: MPI invariants and Poisson
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          mpirun -n 2 pytest --no-cov tests/parallel
          mpirun -n 2 python examples/00_sanity_check.py --quick --output results
          mpirun -n 2 python examples/01_poisson_manufactured.py --quick --output results
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: parallel-smoke-results
          path: results/*.json
          retention-days: 7
