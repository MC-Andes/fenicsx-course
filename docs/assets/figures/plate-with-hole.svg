<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" role="img" aria-labelledby="title desc">
  <title id="title">Placa perforada con concentración de tensiones</title>
  <desc id="desc">Una placa rectangular con agujero central está empotrada a la izquierda y cargada a la derecha; bandas alrededor del agujero indican concentración de tensión.</desc>
  <defs><radialGradient id="stress"><stop offset="0" stop-color="#8b3a2f"/><stop offset=".28" stop-color="#d69a77"/><stop offset=".65" stop-color="#f0ede8"/><stop offset="1" stop-color="#e7f0ed"/></radialGradient><mask id="hole"><rect width="100%" height="100%" fill="#fff"/><circle cx="450" cy="255" r="82" fill="#000"/></mask><style>.plate{fill:url(#stress);stroke:#2d5a4e;stroke-width:4}.hole{fill:#faf9f7;stroke:#1a1a1a;stroke-width:4}.load{stroke:#8b3a2f;stroke-width:4}.fix{stroke:#1a1a1a;stroke-width:5}.ring{fill:none;stroke:#fff;stroke-width:3;opacity:.8}.h{font:600 24px 'DM Sans',Arial,sans-serif;fill:#1a1a1a;text-anchor:middle}.p{font:400 18px 'DM Sans',Arial,sans-serif;fill:#5a5a5a;text-anchor:middle}.eq{font:600 20px Georgia,serif;fill:#1a1a1a;text-anchor:middle}</style><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#8b3a2f"/></marker></defs>
  <rect width="1100" height="540" rx="18" fill="#faf9f7"/>
  <text class="h" x="470" y="48">Placa Gmsh con agujero circular</text>
  <g><rect class="plate" x="100" y="120" width="700" height="270" mask="url(#hole)"/><circle class="hole" cx="450" cy="255" r="82"/><ellipse class="ring" cx="450" cy="255" rx="115" ry="100"/><ellipse class="ring" cx="450" cy="255" rx="145" ry="125"/><line class="fix" x1="100" y1="95" x2="100" y2="415"/><g stroke="#1a1a1a" stroke-width="2"><path d="M100 120L70 140M100 165L70 185M100 210L70 230M100 255L70 275M100 300L70 320M100 345L70 365M100 390L70 410"/></g><g class="load" marker-end="url(#m)"><line x1="800" y1="165" x2="875" y2="165"/><line x1="800" y1="255" x2="875" y2="255"/><line x1="800" y1="345" x2="875" y2="345"/></g></g>
  <g transform="translate(905 145)"><text class="p" x="70" y="0">tracción</text><text class="p" x="70" y="70">agujero libre</text><text class="p" x="70" y="140">σᵥₘ alta</text><text class="p" x="70" y="178">junto al agujero</text><text class="eq" x="70" y="245">Kₜ = σmax / σnom</text></g>
  <text class="p" x="485" y="470">La zona crítica debe estabilizarse al refinar; una sola malla no valida Kₜ.</text>
</svg>
