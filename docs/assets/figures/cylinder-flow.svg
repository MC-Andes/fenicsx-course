<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
  <title id="title">Flujo de Navier–Stokes alrededor de un cilindro</title>
  <desc id="desc">Líneas de corriente rodean un cilindro dentro de un canal; se indican entrada parabólica, no deslizamiento, arrastre y balance de caudal.</desc>
  <defs><style>.chan{fill:#fff;stroke:#1a1a1a;stroke-width:4}.wall{stroke:#8b3a2f;stroke-width:7}.stream{fill:none;stroke:#2d5a4e;stroke-width:4}.cyl{fill:#f0ede8;stroke:#1a1a1a;stroke-width:5}.force{stroke:#8b3a2f;stroke-width:5}.h{font:600 23px 'DM Sans',Arial,sans-serif;fill:#1a1a1a;text-anchor:middle}.p{font:400 17px 'DM Sans',Arial,sans-serif;fill:#5a5a5a;text-anchor:middle}.eq{font:600 19px Georgia,serif;fill:#1a1a1a;text-anchor:middle}</style><marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#2d5a4e"/></marker><marker id="r" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#8b3a2f"/></marker></defs>
  <rect width="1200" height="540" rx="18" fill="#faf9f7"/>
  <text class="h" x="560" y="48">Canal con cilindro · Re bajo</text>
  <g transform="translate(70 110)"><rect class="chan" width="850" height="260"/><line class="wall" x1="0" y1="0" x2="850" y2="0"/><line class="wall" x1="0" y1="260" x2="850" y2="260"/><circle class="cyl" cx="330" cy="130" r="55"/><g class="stream" marker-end="url(#g)"><path d="M20 35C180 35 225 40 285 85C330 115 390 45 820 45"/><path d="M20 80C190 80 230 80 280 105C330 130 400 80 820 80"/><path d="M20 130H255M405 130H820"/><path d="M20 180C190 180 230 180 280 155C330 130 400 180 820 180"/><path d="M20 225C180 225 225 220 285 175C330 145 390 215 820 215"/></g><line class="force" marker-end="url(#r)" x1="330" y1="130" x2="430" y2="130"/><text class="p" x="365" y="105">arrastre</text><text class="p" x="425" y="305">no-slip en paredes y cilindro</text></g>
  <g transform="translate(960 125)"><text class="p" x="90" y="0">Entrada</text><text class="p" x="90" y="35">parabólica</text><text class="eq" x="90" y="105">Re ≈ 3</text><text class="p" x="90" y="170">Picard</text><text class="p" x="90" y="205">convergente</text><text class="eq" x="90" y="275">Qin ≈ Qout</text></g>
  <text class="p" x="530" y="485">La línea de corriente orienta; Picard, arrastre y balance de masa verifican.</text>
</svg>
