<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc">
  <title id="title">Placa rectangular sometida a tracción en elasticidad lineal</title>
  <desc id="desc">Una placa está empotrada a la izquierda y recibe tracción a la derecha; se muestran la forma deformada, la reacción y el balance de fuerzas.</desc>
  <defs><style>.orig{fill:#f0ede8;stroke:#77736e;stroke-width:3;stroke-dasharray:9 7}.def{fill:#e7f0ed;stroke:#2d5a4e;stroke-width:4}.fix{stroke:#1a1a1a;stroke-width:5}.load{stroke:#8b3a2f;stroke-width:4}.react{stroke:#2d5a4e;stroke-width:4}.h{font:600 24px 'DM Sans',Arial,sans-serif;fill:#1a1a1a;text-anchor:middle}.p{font:400 18px 'DM Sans',Arial,sans-serif;fill:#5a5a5a;text-anchor:middle}.eq{font:600 20px Georgia,serif;fill:#1a1a1a;text-anchor:middle}</style><marker id="red" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#8b3a2f"/></marker><marker id="green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#2d5a4e"/></marker></defs>
  <rect width="1100" height="520" rx="18" fill="#faf9f7"/>
  <text class="h" x="470" y="52">Geometría, cargas y respuesta</text>
  <g transform="translate(120 115)"><rect class="orig" width="650" height="210"/><path class="def" d="M0 0L680 15L680 225L0 210Z"/><line class="fix" x1="0" y1="-25" x2="0" y2="240"/><g stroke="#1a1a1a" stroke-width="2"><path d="M0 0L-28 20M0 35L-28 55M0 70L-28 90M0 105L-28 125M0 140L-28 160M0 175L-28 195M0 210L-28 230"/></g><g class="load" marker-end="url(#red)"><line x1="680" y1="45" x2="750" y2="45"/><line x1="680" y1="120" x2="750" y2="120"/><line x1="680" y1="195" x2="750" y2="195"/></g><line class="react" marker-end="url(#green)" x1="0" y1="260" x2="-75" y2="260"/><text class="p" x="325" y="285">línea discontinua: referencia · verde: deformada</text></g>
  <g transform="translate(870 130)"><text class="h" x="80" y="0">Evidencia</text><text class="p" x="80" y="62">tracción T</text><text class="p" x="80" y="108">reacción R</text><text class="eq" x="80" y="170">R + T ≈ 0</text><text class="p" x="80" y="220">energía &gt; 0</text><text class="p" x="80" y="260">uₓ punta &gt; 0</text></g>
  <text class="p" x="520" y="475">La deformada explica el signo; reacción y energía verifican el equilibrio.</text>
</svg>
