<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" role="img" aria-labelledby="title desc">
  <title id="title">Separación de fases en Cahn–Hilliard</title>
  <desc id="desc">Tres mapas temporales muestran dominios de fase que se separan y engrosan; dos curvas indican masa constante y energía libre decreciente.</desc>
  <defs><style>.sq{fill:#e7f0ed;stroke:#1a1a1a;stroke-width:3}.phase{fill:#8b3a2f;opacity:.88}.h{font:600 22px 'DM Sans',Arial,sans-serif;fill:#1a1a1a;text-anchor:middle}.p{font:400 17px 'DM Sans',Arial,sans-serif;fill:#5a5a5a;text-anchor:middle}.axis{stroke:#1a1a1a;stroke-width:2}.mass{stroke:#2d5a4e;stroke-width:5;fill:none}.energy{stroke:#8b3a2f;stroke-width:5;fill:none}</style></defs>
  <rect width="1200" height="580" rx="18" fill="#faf9f7"/>
  <text class="h" x="430" y="45">Evolución de la concentración c</text>
  <g transform="translate(40 90)"><rect class="sq" width="220" height="220"/><g class="phase"><circle cx="35" cy="40" r="14"/><circle cx="95" cy="28" r="12"/><circle cx="165" cy="50" r="16"/><circle cx="60" cy="110" r="13"/><circle cx="135" cy="105" r="18"/><circle cx="200" cy="125" r="12"/><circle cx="35" cy="185" r="18"/><circle cx="110" cy="180" r="14"/><circle cx="180" cy="190" r="17"/></g><text class="h" x="110" y="260">t = 0</text><text class="p" x="110" y="288">perturbación pequeña</text></g>
  <g transform="translate(315 90)"><rect class="sq" width="220" height="220"/><g class="phase"><path d="M10 30C45 5 75 25 70 60S20 85 10 55Z"/><path d="M105 5C160 0 190 30 175 70S110 85 95 45Z"/><path d="M20 120C60 90 105 115 100 160S35 195 10 165Z"/><path d="M130 110C180 85 225 120 215 170S150 220 120 180Z"/></g><text class="h" x="110" y="260">t₁</text><text class="p" x="110" y="288">separación</text></g>
  <g transform="translate(590 90)"><rect class="sq" width="220" height="220"/><g class="phase"><path d="M0 20C75 -15 130 25 115 90S35 130 0 100Z"/><path d="M125 100C205 65 245 125 220 190S135 225 105 170Z"/><path d="M0 175C35 145 85 160 90 220H0Z"/></g><text class="h" x="110" y="260">t₂</text><text class="p" x="110" y="288">coarsening</text></g>
  <g transform="translate(875 70)"><text class="h" x="135" y="0">Invariantes</text><line class="axis" x1="25" y1="190" x2="250" y2="190"/><line class="axis" x1="25" y1="190" x2="25" y2="40"/><path class="mass" d="M45 90L230 90"/><text class="p" x="135" y="225">masa constante</text><line class="axis" x1="25" y1="410" x2="250" y2="410"/><line class="axis" x1="25" y1="410" x2="25" y2="260"/><path class="energy" d="M45 280C100 310 155 355 230 390"/><text class="p" x="135" y="445">energía libre ↓</text></g>
  <text class="p" x="430" y="525">Los patrones cambian; la masa se conserva y la energía no debe aumentar.</text>
</svg>
