<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">De la forma fuerte a la forma débil de Poisson</title>
  <desc id="desc">Cuatro pasos: partir de la ecuación diferencial, multiplicar por una función de prueba, integrar por partes y obtener la forma variacional.</desc>
  <defs><style>.b{fill:#fff;stroke:#d8d3cc;stroke-width:3}.g{fill:#e7f0ed;stroke:#2d5a4e;stroke-width:3}.n{fill:#8b3a2f}.num{font:700 19px Arial,sans-serif;fill:#fff;text-anchor:middle}.h{font:600 21px 'DM Sans',Arial,sans-serif;fill:#1a1a1a;text-anchor:middle}.eq{font:500 20px Georgia,serif;fill:#1a1a1a;text-anchor:middle}.p{font:400 16px 'DM Sans',Arial,sans-serif;fill:#5a5a5a;text-anchor:middle}.a{fill:none;stroke:#77736e;stroke-width:4}</style><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#77736e"/></marker></defs>
  <rect width="1200" height="500" rx="18" fill="#faf9f7"/>
  <path class="a" marker-end="url(#m)" d="M278 250H318"/><path class="a" marker-end="url(#m)" d="M578 250H618"/><path class="a" marker-end="url(#m)" d="M878 250H918"/>
  <g><rect class="b" x="18" y="120" width="260" height="260" rx="14"/><circle class="n" cx="50" cy="153" r="20"/><text class="num" x="50" y="160">1</text><text class="h" x="148" y="165">Forma fuerte</text><text class="eq" x="148" y="230">−∇²u = f</text><text class="eq" x="148" y="270">u = 0 en ∂Ω</text><text class="p" x="148" y="330">segunda derivada</text></g>
  <g><rect class="b" x="318" y="120" width="260" height="260" rx="14"/><circle class="n" cx="350" cy="153" r="20"/><text class="num" x="350" y="160">2</text><text class="h" x="448" y="165">Probar e integrar</text><text class="eq" x="448" y="230">∫Ω (−∇²u) v dx</text><text class="eq" x="448" y="270">= ∫Ω f v dx</text><text class="p" x="448" y="330">v es una variación admisible</text></g>
  <g><rect class="b" x="618" y="120" width="260" height="260" rx="14"/><circle class="n" cx="650" cy="153" r="20"/><text class="num" x="650" y="160">3</text><text class="h" x="748" y="165">Integrar por partes</text><text class="eq" x="748" y="220">∫Ω ∇u · ∇v dx</text><text class="eq" x="748" y="260">− ∫∂Ω (∇u · n)v ds</text><text class="eq" x="748" y="300">= ∫Ω f v dx</text><text class="p" x="748" y="345">una derivada menos sobre u</text></g>
  <g><rect class="g" x="918" y="120" width="264" height="260" rx="14"/><circle class="n" cx="950" cy="153" r="20"/><text class="num" x="950" y="160">4</text><text class="h" x="1050" y="165">Forma débil</text><text class="eq" x="1050" y="225">a(u,v) = L(v)</text><text class="eq" x="1050" y="270">∫Ω ∇u · ∇v dx</text><text class="eq" x="1050" y="310">= ∫Ω f v dx</text><text class="p" x="1050" y="350">lista para UFL</text></g>
  <text class="p" x="600" y="445">Con Dirichlet homogénea, v = 0 en la frontera y el término de contorno desaparece.</text>
</svg>
