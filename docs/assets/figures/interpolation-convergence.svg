<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc">
  <title id="title">Interpolación de un campo sinusoidal con elementos P1 y P2</title>
  <desc id="desc">Un campo sinusoidal exacto se aproxima con superficies P1 y P2; una gráfica muestra que el error P2 decrece más rápido.</desc>
  <defs><linearGradient id="surf" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#2d5a4e"/><stop offset=".5" stop-color="#e7d7bd"/><stop offset="1" stop-color="#8b3a2f"/></linearGradient><style>.panel{fill:#fff;stroke:#d8d3cc;stroke-width:3}.mesh{fill:url(#surf);stroke:#77736e;stroke-width:2}.wire{fill:none;stroke:#fff;stroke-width:1.5;opacity:.75}.axis{stroke:#1a1a1a;stroke-width:2}.p1{stroke:#8b3a2f;stroke-width:5;fill:none}.p2{stroke:#2d5a4e;stroke-width:5;fill:none}.h{font:600 24px 'DM Sans',Arial,sans-serif;fill:#1a1a1a;text-anchor:middle}.p{font:400 17px 'DM Sans',Arial,sans-serif;fill:#5a5a5a;text-anchor:middle}.lab{font:600 16px 'DM Sans',Arial,sans-serif;fill:#1a1a1a}</style></defs>
  <rect width="1100" height="560" rx="18" fill="#faf9f7"/>
  <g transform="translate(35 80)"><text class="h" x="155" y="0">Campo exacto</text><path class="mesh" d="M15 260Q155 20 295 260L260 315Q155 120 50 315Z"/><path class="wire" d="M50 315Q155 120 260 315M15 260L295 260M85 270Q155 75 225 270"/><text class="p" x="155" y="355">sin(πx) sin(πy)</text></g>
  <g transform="translate(355 80)"><text class="h" x="155" y="0">P1</text><path class="mesh" d="M15 260L85 160L155 65L225 160L295 260L260 315L190 210L120 210L50 315Z"/><path class="wire" d="M50 315L155 65L260 315M15 260H295M85 160L225 160M120 210H190"/><text class="p" x="155" y="355">lineal por triángulo</text></g>
  <g transform="translate(700 70)"><text class="h" x="165" y="0">Error al refinar</text><line class="axis" x1="35" y1="340" x2="315" y2="340"/><line class="axis" x1="35" y1="340" x2="35" y2="55"/><path class="p1" d="M65 95L165 185L285 285"/><path class="p2" d="M65 140L165 245L285 325"/><circle cx="65" cy="95" r="7" fill="#8b3a2f"/><circle cx="165" cy="185" r="7" fill="#8b3a2f"/><circle cx="285" cy="285" r="7" fill="#8b3a2f"/><circle cx="65" cy="140" r="7" fill="#2d5a4e"/><circle cx="165" cy="245" r="7" fill="#2d5a4e"/><circle cx="285" cy="325" r="7" fill="#2d5a4e"/><text class="p" x="175" y="375">h → menor</text><line class="p1" x1="70" y1="420" x2="115" y2="420"/><text class="lab" x="135" y="426">P1 ≈ O(h²)</text><line class="p2" x1="70" y1="460" x2="115" y2="460"/><text class="lab" x="135" y="466">P2 ≈ O(h³)</text></g>
  <text class="p" x="340" y="520">La superficie ayuda a comparar; las tasas demuestran el orden de aproximación.</text>
</svg>
