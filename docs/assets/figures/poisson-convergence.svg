<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc">
  <title id="title">Refinamiento y convergencia para Poisson con elementos P1</title>
  <desc id="desc">Tres mallas cada vez más finas producen una aproximación más cercana a la solución exacta; el error L2 decrece cuadráticamente y el error H1 linealmente.</desc>
  <defs><style>.mesh{fill:#fff;stroke:#77736e;stroke-width:2}.g{stroke:#d8d3cc;stroke-width:1}.arrow{stroke:#77736e;stroke-width:4;fill:none}.h{font:600 24px 'DM Sans',Arial,sans-serif;fill:#1a1a1a;text-anchor:middle}.p{font:400 18px 'DM Sans',Arial,sans-serif;fill:#5a5a5a;text-anchor:middle}.l2{stroke:#2d5a4e;stroke-width:5;fill:none}.h1{stroke:#8b3a2f;stroke-width:5;fill:none}.axis{stroke:#1a1a1a;stroke-width:2}</style><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#77736e"/></marker></defs>
  <rect width="1100" height="560" rx="18" fill="#faf9f7"/>
  <text class="h" x="300" y="55">Refinar la malla</text>
  <g transform="translate(50 105)"><rect class="mesh" width="130" height="130"/><path class="g" d="M0 65H130M65 0V130M0 0L65 65M65 0L130 65M0 65L65 130M65 65L130 130"/></g>
  <path class="arrow" marker-end="url(#m)" d="M195 170H250"/>
  <g transform="translate(270 105)"><rect class="mesh" width="130" height="130"/><path class="g" d="M0 32.5H130M0 65H130M0 97.5H130M32.5 0V130M65 0V130M97.5 0V130M0 0L32.5 32.5M32.5 0L65 32.5M65 0L97.5 32.5M97.5 0L130 32.5M0 32.5L32.5 65M32.5 32.5L65 65M65 32.5L97.5 65M97.5 32.5L130 65M0 65L32.5 97.5M32.5 65L65 97.5M65 65L97.5 97.5M97.5 65L130 97.5M0 97.5L32.5 130M32.5 97.5L65 130M65 97.5L97.5 130M97.5 97.5L130 130"/></g>
  <path class="arrow" marker-end="url(#m)" d="M415 170H470"/>
  <g transform="translate(490 105)"><rect class="mesh" width="130" height="130"/><path class="g" d="M0 21.7H130M0 43.3H130M0 65H130M0 86.7H130M0 108.3H130M21.7 0V130M43.3 0V130M65 0V130M86.7 0V130M108.3 0V130"/></g>
  <text class="p" x="115" y="272">h</text><text class="p" x="335" y="272">h/2</text><text class="p" x="555" y="272">h/4</text>
  <g transform="translate(700 90)"><text class="h" x="155" y="0">Error observado</text><line class="axis" x1="30" y1="330" x2="310" y2="330"/><line class="axis" x1="30" y1="330" x2="30" y2="55"/><path class="l2" d="M55 85L155 185L275 295"/><circle cx="55" cy="85" r="7" fill="#2d5a4e"/><circle cx="155" cy="185" r="7" fill="#2d5a4e"/><circle cx="275" cy="295" r="7" fill="#2d5a4e"/><path class="h1" d="M55 145L155 220L275 290"/><circle cx="55" cy="145" r="7" fill="#8b3a2f"/><circle cx="155" cy="220" r="7" fill="#8b3a2f"/><circle cx="275" cy="290" r="7" fill="#8b3a2f"/><text class="p" x="170" y="370">tamaño h → menor</text><text class="p" transform="translate(-5 200) rotate(-90)" x="0" y="0">error → menor</text><line class="l2" x1="55" y1="420" x2="100" y2="420"/><text class="p" x="180" y="427">L2 ≈ O(h²)</text><line class="h1" x1="55" y1="460" x2="100" y2="460"/><text class="p" x="180" y="467">H1 ≈ O(h)</text></g>
  <text class="p" x="310" y="470">Una figura plausible orienta; la tasa medida confirma.</text>
</svg>
