<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Comparación de condiciones de frontera Dirichlet, Neumann y Robin</title>
  <desc id="desc">Tres dominios cuadrados muestran respectivamente un valor fijado, un flujo fijado y una relación entre valor y flujo.</desc>
  <defs><style>.d{fill:#fff;stroke:#d8d3cc;stroke-width:3}.edge{stroke:#8b3a2f;stroke-width:12}.arr{stroke:#2d5a4e;stroke-width:4}.h{font:600 25px 'DM Sans',Arial,sans-serif;fill:#1a1a1a;text-anchor:middle}.eq{font:500 20px Georgia,serif;fill:#1a1a1a;text-anchor:middle}.p{font:400 17px 'DM Sans',Arial,sans-serif;fill:#5a5a5a;text-anchor:middle}.tag{font:700 15px 'DM Sans',Arial,sans-serif;fill:#8b3a2f;text-anchor:middle}</style><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#2d5a4e"/></marker></defs>
  <rect width="1200" height="500" rx="18" fill="#faf9f7"/>
  <g transform="translate(80 55)"><text class="h" x="130" y="0">Dirichlet</text><rect class="d" x="30" y="50" width="200" height="200"/><line class="edge" x1="30" y1="50" x2="30" y2="250"/><text class="tag" x="60" y="155" transform="rotate(-90 60 155)">VALOR FIJO</text><text class="eq" x="130" y="310">u = g</text><text class="p" x="130" y="350">restringe grados de libertad</text></g>
  <g transform="translate(470 55)"><text class="h" x="130" y="0">Neumann</text><rect class="d" x="30" y="50" width="200" height="200"/><line class="edge" x1="230" y1="50" x2="230" y2="250"/><g class="arr" marker-end="url(#m)"><line x1="230" y1="90" x2="285" y2="90"/><line x1="230" y1="150" x2="285" y2="150"/><line x1="230" y1="210" x2="285" y2="210"/></g><text class="eq" x="130" y="310">∂ₙu = g</text><text class="p" x="130" y="350">entra como carga en ds</text></g>
  <g transform="translate(860 55)"><text class="h" x="130" y="0">Robin</text><rect class="d" x="30" y="50" width="200" height="200"/><line class="edge" x1="30" y1="250" x2="230" y2="250"/><g class="arr" marker-end="url(#m)"><line x1="80" y1="250" x2="80" y2="300"/><line x1="130" y1="250" x2="130" y2="300"/><line x1="180" y1="250" x2="180" y2="300"/></g><text class="eq" x="130" y="330">∂ₙu + αu = r</text><text class="p" x="130" y="370">modifica a y L</text></g>
  <text class="p" x="600" y="465">La geometría identifica la frontera; la formulación determina qué condición actúa sobre ella.</text>
</svg>
