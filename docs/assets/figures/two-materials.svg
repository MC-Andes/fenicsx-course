<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc">
  <title id="title">Placa elástica formada por dos materiales adheridos</title>
  <desc id="desc">Dos subdominios con módulos elásticos distintos comparten una interfaz; el desplazamiento es continuo y la tracción está equilibrada.</desc>
  <defs><style>.m1{fill:#dce9e5;stroke:#2d5a4e;stroke-width:4}.m2{fill:#efd9d3;stroke:#8b3a2f;stroke-width:4}.int{stroke:#1a1a1a;stroke-width:5;stroke-dasharray:10 7}.load{stroke:#8b3a2f;stroke-width:4}.fix{stroke:#1a1a1a;stroke-width:5}.disp{fill:none;stroke:#4e6f91;stroke-width:5}.h{font:600 24px 'DM Sans',Arial,sans-serif;fill:#1a1a1a;text-anchor:middle}.p{font:400 18px 'DM Sans',Arial,sans-serif;fill:#5a5a5a;text-anchor:middle}.eq{font:600 20px Georgia,serif;fill:#1a1a1a;text-anchor:middle}</style><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#8b3a2f"/></marker></defs>
  <rect width="1100" height="520" rx="18" fill="#faf9f7"/>
  <text class="h" x="500" y="50">Dos materiales, una interfaz adherida</text>
  <g transform="translate(100 115)"><rect class="m1" width="340" height="230"/><rect class="m2" x="340" width="340" height="230"/><line class="int" x1="340" y1="0" x2="340" y2="230"/><line class="fix" x1="0" y1="-20" x2="0" y2="250"/><g stroke="#1a1a1a" stroke-width="2"><path d="M0 0L-28 20M0 38L-28 58M0 76L-28 96M0 114L-28 134M0 152L-28 172M0 190L-28 210M0 228L-28 248"/></g><g class="load" marker-end="url(#m)"><line x1="680" y1="45" x2="755" y2="45"/><line x1="680" y1="115" x2="755" y2="115"/><line x1="680" y1="185" x2="755" y2="185"/></g><text class="h" x="170" y="105">E₁ = 100</text><text class="h" x="510" y="105">E₂ = 400</text><path class="disp" d="M80 285C210 260 330 230 340 225C430 190 525 160 640 145"/></g>
  <g transform="translate(890 130)"><text class="p" x="70" y="0">interfaz</text><text class="eq" x="70" y="55">[u] = 0</text><text class="eq" x="70" y="105">[σn] = 0</text><text class="p" x="70" y="170">la pendiente de u</text><text class="p" x="70" y="202">sí puede cambiar</text></g>
  <text class="p" x="510" y="470">Continuidad de desplazamiento no significa igual deformación en ambos materiales.</text>
</svg>
