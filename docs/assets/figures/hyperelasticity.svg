<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 540" role="img" aria-labelledby="title desc">
  <title id="title">Carga incremental de un bloque neo-Hookeano</title>
  <desc id="desc">Tres estados convergidos muestran deformación creciente del bloque; una gráfica indica incrementos de carga y la condición de Jacobiano positivo.</desc>
  <defs><style>.ref{fill:none;stroke:#9b968f;stroke-width:3;stroke-dasharray:8 7}.def{fill:#e7f0ed;stroke:#2d5a4e;stroke-width:4}.fix{stroke:#1a1a1a;stroke-width:4}.load{stroke:#8b3a2f;stroke-width:4}.h{font:600 22px 'DM Sans',Arial,sans-serif;fill:#1a1a1a;text-anchor:middle}.p{font:400 17px 'DM Sans',Arial,sans-serif;fill:#5a5a5a;text-anchor:middle}.ok{font:700 20px 'DM Sans',Arial,sans-serif;fill:#2d5a4e;text-anchor:middle}.axis{stroke:#1a1a1a;stroke-width:2}.curve{fill:none;stroke:#8b3a2f;stroke-width:5}</style><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#8b3a2f"/></marker></defs>
  <rect width="1150" height="540" rx="18" fill="#faf9f7"/>
  <text class="h" x="410" y="48">Estado convergido en cada incremento</text>
  <g transform="translate(50 110)"><rect class="ref" width="210" height="100"/><path class="def" d="M0 0L210 0L210 100L0 100Z"/><line class="fix" x1="0" y1="-15" x2="0" y2="115"/><text class="h" x="105" y="150">T₁</text></g>
  <g transform="translate(310 110)"><rect class="ref" width="210" height="100"/><path class="def" d="M0 0L235 8L235 110L0 100Z"/><line class="fix" x1="0" y1="-15" x2="0" y2="115"/><text class="h" x="115" y="150">T₂</text></g>
  <g transform="translate(610 110)"><rect class="ref" width="210" height="100"/><path class="def" d="M0 0L260 18L260 125L0 100Z"/><line class="fix" x1="0" y1="-15" x2="0" y2="115"/><line class="load" marker-end="url(#m)" x1="260" y1="70" x2="325" y2="70"/><text class="h" x="130" y="165">Tfinal = 5</text></g>
  <g transform="translate(820 300)"><line class="axis" x1="25" y1="150" x2="255" y2="150"/><line class="axis" x1="25" y1="150" x2="25" y2="10"/><path class="curve" d="M45 130L100 100L155 70L220 35"/><circle cx="45" cy="130" r="6" fill="#8b3a2f"/><circle cx="100" cy="100" r="6" fill="#8b3a2f"/><circle cx="155" cy="70" r="6" fill="#8b3a2f"/><circle cx="220" cy="35" r="6" fill="#8b3a2f"/><text class="p" x="140" y="185">incremento</text><text class="p" x="140" y="-8">carga</text></g>
  <text class="ok" x="400" y="390">SNES convergente · Jmin &gt; 0.5 · energía positiva</text><text class="p" x="410" y="440">Si un incremento falla, se reduce el paso; no se oculta un elemento invertido.</text>
</svg>
