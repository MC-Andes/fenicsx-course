<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 560" role="img" aria-labelledby="title desc">
  <title id="title">Difusión transitoria de una temperatura sinusoidal</title>
  <desc id="desc">Tres mapas temporales muestran cómo disminuye la amplitud de la temperatura, junto a una curva de energía monótonamente decreciente.</desc>
  <defs><radialGradient id="hot"><stop offset="0" stop-color="#8b3a2f"/><stop offset=".45" stop-color="#d6a07d"/><stop offset="1" stop-color="#2d5a4e"/></radialGradient><style>.field{fill:url(#hot);stroke:#1a1a1a;stroke-width:3}.fade1{opacity:.68}.fade2{opacity:.42}.h{font:600 22px 'DM Sans',Arial,sans-serif;fill:#1a1a1a;text-anchor:middle}.p{font:400 17px 'DM Sans',Arial,sans-serif;fill:#5a5a5a;text-anchor:middle}.axis{stroke:#1a1a1a;stroke-width:2}.curve{fill:none;stroke:#2d5a4e;stroke-width:5}.a{stroke:#77736e;stroke-width:4;fill:none}</style><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#77736e"/></marker></defs>
  <rect width="1150" height="560" rx="18" fill="#faf9f7"/>
  <text class="h" x="380" y="48">Campo de temperatura</text>
  <g transform="translate(50 100)"><rect class="field" width="190" height="190"/><circle cx="95" cy="95" r="9" fill="#fff"/><text class="h" x="95" y="235">t = 0</text><text class="p" x="95" y="265">amplitud alta</text></g>
  <path class="a" marker-end="url(#m)" d="M255 195H300"/>
  <g transform="translate(315 100)"><rect class="field fade1" width="190" height="190"/><circle cx="95" cy="95" r="7" fill="#fff"/><text class="h" x="95" y="235">t₁</text><text class="p" x="95" y="265">difusión</text></g>
  <path class="a" marker-end="url(#m)" d="M520 195H565"/>
  <g transform="translate(580 100)"><rect class="field fade2" width="190" height="190"/><circle cx="95" cy="95" r="5" fill="#fff"/><text class="h" x="95" y="235">t₂</text><text class="p" x="95" y="265">amplitud menor</text></g>
  <g transform="translate(825 85)"><text class="h" x="140" y="0">Energía térmica</text><line class="axis" x1="25" y1="280" x2="270" y2="280"/><line class="axis" x1="25" y1="280" x2="25" y2="40"/><path class="curve" d="M45 65C95 130 155 190 255 255"/><text class="p" x="150" y="320">tiempo</text><text class="p" transform="translate(-5 165) rotate(-90)" x="0" y="0">energía</text><text class="p" x="150" y="370">Eⁿ⁺¹ ≤ Eⁿ</text></g>
  <text class="p" x="430" y="490">Euler implícito avanza el estado; la energía debe decrecer en cada paso.</text>
</svg>
