site_name: Curso FEniCSx/DOLFINx · MC-Andes
site_url: https://mc-andes.github.io/fenicsx-course/
site_description: Curso abierto y verificable de FEniCSx 0.11 en español
repo_url: https://github.com/MC-Andes/fenicsx-course
repo_name: MC-Andes/fenicsx-course
edit_uri: edit/main/docs/
theme:
  name: material
  language: es
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy
    - content.tabs.link
  palette:
    - scheme: default
      primary: custom
      accent: custom
nav:
  - Inicio: index.md
  - Empieza aquí:
      - Mapa y rutas: learning-path.md
      - Programa: syllabus.md
      - Instalación: setup.md
      - Comprobación previa: practice/prior-knowledge.md
      - Cómo estudiar: self-study-guide.md
  - Núcleo común:
      - 0 · Orientación: modules/00-orientation/index.md
      - 1 · Matemática y forma débil: foundations/weak-forms.md
      - 2 · Primer problema — Poisson: modules/04-poisson/index.md
      - 3 · Objetos de DOLFINx: modules/01-variables/index.md
      - 4 · Mallas, etiquetas y fronteras: modules/02-meshes/index.md
      - 5 · Elementos, espacios y convergencia: modules/03-spaces/index.md
  - Transferencia de calor:
      - 6 · Difusión transitoria: modules/05-diffusion/index.md
  - Mecánica de sólidos:
      - Ruta de sólidos: tracks/solids.md
      - 7 · Elasticidad lineal: modules/06-elasticity/index.md
      - 8 · Gmsh y materiales: modules/07-gmsh/index.md
      - 9 · Hiperelasticidad: modules/09-nonlinear/index.md
  - Mecánica de fluidos:
      - Ruta de fluidos: tracks/fluids.md
      - 10 · Stokes: modules/08-stokes/index.md
      - 11 · Navier–Stokes: modules/navier-stokes/index.md
  - Multifísica:
      - 12 · Cahn–Hilliard: modules/10-multiphysics/index.md
  - Herramientas transversales:
      - PETSc, MPI e I/O: modules/11-solvers/index.md
  - Repertorio verificable: examples/index.md
  - Práctica autónoma:
      - Ejercicios y soluciones: practice/exercises.md
      - Lista de proyecto: practice/project-checklist.md
  - Equipo y créditos: team.md
  - Glosario: glossary.md
  - Solución de problemas: troubleshooting.md
  - Accesibilidad: accessibility.md
  - Versiones y mantenimiento: version.md
  - Referencias: references.md
plugins:
  - search
markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: [.]
      check_paths: true
  - pymdownx.superfences
extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
extra_css:
  - stylesheets/extra.css
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/MC-Andes
copyright: Copyright &copy; 2026 MC-Andes · Código MIT · Contenido CC BY 4.0
strict: true
